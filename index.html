<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1e33" />
<meta name="description" content="Punktezähler für das Kartenspiel Skull King – für Android und iOS." />
<title>Skull King Punktezähler</title>

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Skull King" />
<link rel="stylesheet" href="css/styles.css" />

<div id="app" aria-live="polite"></div>

<!-- Dialog für Bonus-Erklärung -->
<dialog id="bonus-info">
  <h2>Bonuspunkte</h2>
  <p>Bonuspunkte zählen nur, wenn das Gebot <strong>genau</strong> erfüllt wurde.</p>
  <ul>
    <li>Jede gefangene farbige <strong>14</strong>: +10</li>
    <li>Schwarze <strong>14</strong> (Jolly Roger): +20</li>
    <li>Skull King fängt einen Piraten: +30 je Pirat</li>
    <li>Meerjungfrau fängt den Skull King: +50</li>
  </ul>
  <p class="muted">Trage die Summe der Bonuspunkte pro Runde ein (Schritte à 10).</p>
  <form method="dialog"><button class="btn">Verstanden</button></form>
</dialog>

<script src="js/scoring.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
