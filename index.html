<script>
  // Die App ist nach ./pirate/ umgezogen. Einen evtl. hier noch aktiven
  // alten Service Worker abmelden, damit er diese Seite nicht aus dem
  // Cache bedient, dann weiterleiten.
  function goPirate() { location.replace('./pirate/'); }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then((regs) => Promise.all(
        regs.filter((r) => !r.scope.includes('/pirate')).map((r) => r.unregister())
      ))
      .catch(() => {})
      .then(goPirate);
  } else {
    goPirate();
  }
</script>
