<link rel="manifest" href="manifest.webmanifest" />

<!-- Dialog für Bonus-Erklärung -->
<dialog id="bonus-info">
  <h2>Bonuspunkte</h2>
  <p>Bonuspunkte zählen nur, wenn das Gebot <strong>genau</strong> erfüllt wurde.</p>
  <ul>
    <li>Jede gefangene farbige <strong>14</strong>: +10</li>
    <li>Schwarze <strong>14</strong> (Jolly Roger): +20</li>
    <li>Skull King fängt einen Piraten: +30 je Pirat</li>
    <li>Meerjungfrau fängt den Skull King: +50</li>
  </ul>
  <p class="muted">Trage die Summe der Bonuspunkte pro Runde ein (Schritte à 10).</p>
  <form method="dialog"><button class="btn">Verstanden</button></form>
</dialog>

<script src="js/scoring.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    // Wenn ein neuer Service Worker die Kontrolle übernimmt, einmalig neu laden,
    // damit sofort die aktuelle Version läuft (nicht beim allerersten Installieren).
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloaded) return;
      reloaded = true;
      window.location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        reg.update();
        setInterval(() => reg.update(), 60000); // regelmäßig auf Updates prüfen
      }).catch(() => {});
    });
  }
</script>
